syntax = "proto3";

package gameagent.protocol.v1alpha2;

import "google/protobuf/struct.proto";

option csharp_namespace = "GameAgent.Protocol.V1Alpha2";
option go_package = "gameagent/protocol/gen/go/gameagent/protocol/v1alpha2;protocolv1alpha2";

service GameAgentGateway {
  rpc Connect(stream AdapterMessage) returns (stream RuntimeMessage);
}

message AdapterHello {
  string adapter_id = 1;
  string adapter_version = 2;
  string protocol_version = 3;
  string game_id = 4;
  string game_version = 5;
  string session_id = 6;
}

message EnvironmentReady {
  string session_id = 1;
  int64 server_time_unix_ms = 2;
}

message EntityRef {
  string entity_id = 1;
  string entity_type = 2;
  string display_name = 3;
  string definition_id = 4;
}

message GameTime {
  optional int32 year = 1;
  optional int32 season = 2;
  optional int32 day = 3;
  optional int32 hour = 4;
  optional int32 minute = 5;
  optional int64 tick = 6;
}

message ContextFact {
  string kind = 1;
  string actor_entity_id = 2;
  string target_entity_id = 3;
  string scope_id = 4;
  string text = 5;
  string label = 6;
  google.protobuf.Struct attributes = 7;
}

message GameEvent {
  string event_id = 1;
  string event_type = 2;
  repeated EntityRef entities = 3;
  GameTime game_time = 4;
  google.protobuf.Struct payload = 5;
  uint64 sequence = 6;
  string world_id = 7;
  string target_entity_id = 8;
  repeated ContextFact context_facts = 9;
}

enum EventAckStatus {
  EVENT_ACK_STATUS_UNSPECIFIED = 0;
  EVENT_ACK_STATUS_ACCEPTED = 1;
  EVENT_ACK_STATUS_DUPLICATE = 2;
  EVENT_ACK_STATUS_REJECTED = 3;
}

message EventAck {
  string event_id = 1;
  EventAckStatus status = 2;
  Error error = 3;
}

message ObserveRequest {
  string entity_id = 1;
  string world_id = 2;
}

message Observation {
  string entity_id = 1;
  uint64 revision = 2;
  GameTime game_time = 3;
  google.protobuf.Struct state = 4;
  repeated EntityRef nearby_entities = 5;
  google.protobuf.Struct extensions = 6;
  string world_id = 7;
}

enum ExecutionMode {
  EXECUTION_MODE_UNSPECIFIED = 0;
  EXECUTION_MODE_SYNC = 1;
  EXECUTION_MODE_ASYNC = 2;
}

enum CapabilityConcurrencyMode {
  CAPABILITY_CONCURRENCY_MODE_UNSPECIFIED = 0;
  CAPABILITY_CONCURRENCY_MODE_SEQUENTIAL = 1;
  CAPABILITY_CONCURRENCY_MODE_PARALLEL_SAFE = 2;
}

message Capability {
  string name = 1;
  string version = 2;
  string description = 3;
  string input_schema_json = 4;
  ExecutionMode execution_mode = 5;
  google.protobuf.Struct extensions = 6;
  CapabilityConcurrencyMode concurrency_mode = 7;
}

message CapabilityRequest {
  optional string entity_id = 1;
}

message CapabilityList {
  optional string entity_id = 1;
  repeated Capability capabilities = 2;
  uint64 revision = 3;
}

message ActionRequest {
  string action_id = 1;
  string entity_id = 2;
  string capability = 3;
  google.protobuf.Struct arguments = 4;
  google.protobuf.Struct extensions = 5;
  string world_id = 6;
}

enum ActionStatus {
  ACTION_STATUS_UNSPECIFIED = 0;
  ACTION_STATUS_PENDING = 1;
  ACTION_STATUS_ACCEPTED = 2;
  ACTION_STATUS_RUNNING = 3;
  ACTION_STATUS_SUCCEEDED = 4;
  ACTION_STATUS_FAILED = 5;
  ACTION_STATUS_INTERRUPTED = 6;
  ACTION_STATUS_CANCELLED = 7;
  ACTION_STATUS_REJECTED = 8;
}

message ActionStatusUpdate {
  string action_id = 1;
  ActionStatus status = 2;
  google.protobuf.Struct metadata = 3;
}

message ActionResult {
  string action_id = 1;
  ActionStatus status = 2;
  google.protobuf.Struct output = 3;
  Error error = 4;
}

message CancelActionRequest {
  string action_id = 1;
  string reason = 2;
}

message Error {
  string code = 1;
  string message = 2;
  google.protobuf.Struct details = 3;
}

message Heartbeat {
  int64 timestamp_unix_ms = 1;
  uint64 last_event_sequence = 2;
}

message AdapterMessage {
  string message_id = 1;
  string correlation_id = 2;

  oneof payload {
    AdapterHello hello = 10;
    GameEvent event = 11;
    Observation observation = 12;
    CapabilityList capabilities = 13;
    ActionStatusUpdate action_status = 14;
    ActionResult action_result = 15;
    Heartbeat heartbeat = 16;
    Error error = 17;
  }
}

message RuntimeMessage {
  string message_id = 1;
  string correlation_id = 2;

  oneof payload {
    EnvironmentReady environment_ready = 10;
    ObserveRequest observe = 11;
    CapabilityRequest capability_request = 12;
    ActionRequest action = 13;
    CancelActionRequest cancel_action = 14;
    EventAck event_ack = 15;
    Error error = 16;
  }
}
